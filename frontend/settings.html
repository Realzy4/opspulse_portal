<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpsPulse - Definições</title>
    <style>
        /* Reset e variáveis CSS */
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border-color: #334155;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1f3a 100%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .back-btn {
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* Main content */
        main {
            flex: 1;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .settings-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        .settings-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Estilo do select */
        select, input {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition);
            box-sizing: border-box;
        }

        select:hover, input:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1), 0 4px 12px rgba(56, 189, 248, 0.15);
        }

        select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* Botões */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .save-btn {
            background: linear-gradient(135deg, var(--accent-blue), #0284c7);
            color: var(--text-primary);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
            background: linear-gradient(135deg, #0284c7, var(--accent-blue));
        }

        .save-btn:active {
            transform: translateY(0);
        }

        /* Mensagem de feedback */
        .feedback-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            animation: slideDown 0.4s ease-out;
            font-weight: 500;
            border-left: 4px solid;
        }

        .feedback-message.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border-left-color: var(--accent-green);
            display: block;
        }

        .feedback-message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border-left-color: var(--accent-red);
            display: block;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 40px;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
                margin-bottom: 30px;
            }

            .header-title {
                font-size: 1.5rem;
            }

            .settings-card {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            body {
                padding: 15px;
            }
        }

        /* Acessibilidade */
        button:focus-visible,
        select:focus-visible,
        input:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--accent-blue);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1 class="header-title">OpsPulse Definições</h1>
            <a href="index.html" class="back-btn">← Voltar</a>
        </header>

        <!-- Main content -->
        <main>
            <div class="settings-card">
                <h2 class="settings-title">Configuração de Custos</h2>

                <!-- Price Input -->
                <div class="form-group">
                    <label for="client-select">Selecionar Cliente:</label>
                    <select id="client-select"></select>
                </div>

                <div class="form-group">
                    <label for="preco">Preço por kWh (€):</label>
                    <input type="number" id="preco" step="0.0001" placeholder="Ex: 0.1550" min="0">
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button class="save-btn" onclick="salvarPreco()">Guardar Alterações</button>
                </div>

                <!-- Feedback Message -->
                <div id="mensagem" class="feedback-message"></div>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 OpsPulse. Sistema de Gestão de Energia.</p>
        </footer>
    </div>

    <script>
        const API_TOKEN = "OpsPulse_Super_Secret_2026";
        const API_URL = "/api/preco-kwh";

        function getCurrentClientId() {
            return localStorage.getItem('client_id');
        }

        function requireSession() {
            const clientId = getCurrentClientId();
            if (!clientId) {
                window.location.href = 'login.html';
            }
            return clientId;
        }

        async function carregarClients() {
            try {
                const res = await fetch('/api/clients');
                const clients = await res.json();
                const select = document.getElementById('client-select');
                select.innerHTML = '';
                clients.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.name + ' (' + c.id + ')';
                    select.appendChild(opt);
                });

                const current = getCurrentClientId();
                if (current) select.value = current;
                await carregarPreco();
            } catch (error) {
                console.error('Erro ao carregar clients', error);
            }
        }

        async function carregarPreco() {
            try {
                const select = document.getElementById('client-select');
                const selectedClientId = select ? select.value : requireSession();
                const response = await fetch(`${API_URL}?client_id=${selectedClientId}`);
                const data = await response.json();

                if (data.preco || data.preco === 0 || data.preco === '0') {
                    document.getElementById('preco').value = data.preco;
                    limparMensagem();
                }
            } catch (error) {
                console.error("Erro ao carregar preço:", error);
                exibirMensagem("Erro ao carregar preço do cliente.", "error");
            }
        }

        async function salvarPreco() {
            const select = document.getElementById('client-select');
            const selectedClientId = select ? select.value : requireSession();
            const novoPreco = document.getElementById('preco').value;

            if (!novoPreco && novoPreco !== '0') {
                exibirMensagem("Por favor, insere um valor de preço.", "error");
                return;
            }

            try {
                const response = await fetch(`${API_URL}?client_id=${selectedClientId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': API_TOKEN,
                        'X-Client-Id': selectedClientId
                    },
                    body: JSON.stringify({ preco: novoPreco, client_id: selectedClientId })
                });

                const result = await response.json();
                if (response.ok) {
                    exibirMensagem("Preço atualizado com sucesso!", "success");
                } else {
                    exibirMensagem("Erro: " + (result.mensagem || "Falha ao guardar"), "error");
                }
            } catch (error) {
                exibirMensagem("Erro ao conectar com a API.", "error");
                console.error(error);
            }
        }

        function exibirMensagem(texto, tipo) {
            const msgDiv = document.getElementById('mensagem');
            msgDiv.innerText = texto;
            msgDiv.className = `feedback-message ${tipo}`;
            msgDiv.style.display = 'block';
        }

        function limparMensagem() {
            const msgDiv = document.getElementById('mensagem');
            msgDiv.style.display = 'none';
            msgDiv.className = 'feedback-message';
        }

        async function init() {
            requireSession();
            await carregarClients();
            const select = document.getElementById('client-select');
            if (select) select.addEventListener('change', carregarPreco);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
