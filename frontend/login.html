<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpsPulse Login</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #152236;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent-blue: #38bdf8;
            --accent-red: #ef4444;
            --border-color: #334155;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            --transition: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, rgba(56, 189, 248, 0.15), transparent 35%),
                        linear-gradient(180deg, var(--bg-primary) 0%, #111827 100%);
            color: var(--text-primary);
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-card {
            width: min(100%, 420px);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 36px 32px;
        }

        .login-title {
            margin: 0 0 16px;
            font-size: 2rem;
            letter-spacing: -0.03em;
            color: var(--text-primary);
        }

        .login-subtitle {
            margin: 0 0 28px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.88rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: #152a45;
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-blue), #0ea5e9);
            color: var(--bg-primary);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 40px rgba(56, 189, 248, 0.18);
        }

        .feedback {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.12);
            color: var(--accent-red);
            font-size: 0.95rem;
            display: none;
        }

        .feedback.visible {
            display: block;
        }

        .info-line {
            margin-top: 22px;
            font-size: 0.92rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .info-line a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        .info-line a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 class="login-title">Bem-vindo à OpsPulse</h1>
        <p class="login-subtitle">Acede à tua dashboard segura com as mesmas credenciais do cliente.</p>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" placeholder="alfa_user" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-button">Entrar</button>
            <div id="login-message" class="feedback"></div>
        </form>

        <p class="info-line">Utilizador de teste: <strong>alfa_user</strong> / <strong>admin123</strong></p>
    </div>

    <script>
        if (localStorage.getItem('client_id')) {
            window.location.href = 'index.html';
        }

        const loginForm = document.getElementById('login-form');
        const loginMessage = document.getElementById('login-message');

        function showError(message) {
            loginMessage.textContent = message;
            loginMessage.classList.add('visible');
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            loginMessage.classList.remove('visible');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (!response.ok) {
                    showError(data.mensagem || 'Credenciais inválidas');
                    return;
                }

                localStorage.setItem('client_id', data.client_id);
                localStorage.setItem('username', data.username);
                window.location.href = 'index.html';
            } catch (error) {
                showError('Erro de ligação. Tenta novamente.');
                console.error(error);
            }
        });
    </script>
</body>
</html>
