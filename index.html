<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpsPulse | Gestão Energética</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="site-header">
        <div class="brand">
            <h1 class="brand__name">OPSPULSE</h1>
            <p class="brand__tag">Portal de Gestão Energética</p>
        </div>
        <div class="header-actions">
            <a class="nav-link" href="settings.html">Configurações</a>
            <div class="status-pill">
                <span class="status-pill__dot"></span>
                <span>Sistema Online</span>
            </div>
        </div>
    </div>

    <div class="grid">
        <!-- Card do Gráfico de Consumo -->
        <div class="card">
            <h3>Consumo em Tempo Real (Watts)</h3>
            <iframe src="http://localhost:3000/d-solo/adjmrmv/monitorizacao-de-energia?orgId=1&from=1777983981581&to=1778005581581&timezone=browser&panelId=panel-1" width="100%" height="420" frameborder="0"></iframe>
        </div>

        <!-- Card do Custo Financeiro -->
        <div class="card">
            <h3>Custo Estimado (€/h)</h3>
            <iframe src="http://localhost:3000/d-solo/adjmrmv/monitorizacao-de-energia?orgId=1&from=1777983981581&to=1778005581581&timezone=browser&panelId=panel-2" width="100%" height="420" frameborder="0"></iframe>
        </div>
    </div>

    <script>
        const settingsForm = document.getElementById('settingsForm');
        const saveStatus = document.getElementById('saveStatus');

        settingsForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const price = Number(document.getElementById('kwhPrice').value);
            if (Number.isNaN(price)) {
                saveStatus.textContent = 'Introduza um valor válido.';
                saveStatus.style.color = '#ff6b6b';
                return;
            }

            saveStatus.textContent = 'A guardar...';
            saveStatus.style.color = 'var(--text)';

            try {
                const response = await fetch('/api/preco-kwh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ kwhPrice: price })
                });

                if (!response.ok) {
                    throw new Error('Erro no servidor');
                }

                saveStatus.textContent = 'Guardado com sucesso.';
                saveStatus.style.color = 'var(--accent-strong)';
            } catch (error) {
                console.error(error);
                saveStatus.textContent = 'Erro ao guardar. Verifique o servidor.';
                saveStatus.style.color = '#ff6b6b';
            }
        });
    </script>
</body>
</html>
