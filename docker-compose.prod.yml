version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - DOMAIN_NAME=${DOMAIN_NAME}
      - X_API_KEY=${X_API_KEY}
    depends_on:
      - db
    restart: unless-stopped

  portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile.portal
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${DOMAIN_NAME}/grafana
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  proxy:
    image: nginx:stable-alpine
    container_name: opspulse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - portal
      - api
      - grafana
    restart: unless-stopped

  certbot:
    build:
      context: ./certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh","-c","trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook \"docker kill -s HUP opspulse-proxy\" || true; sleep 12h & wait $${!}; done"]
    restart: unless-stopped

volumes:
  db_data:
  grafana_data:
  certbot-etc:
  certbot-var:
  certbot-www:
